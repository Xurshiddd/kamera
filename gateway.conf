# =============================================================================
#  Gateway nginx (Docker): admin SPA + /api + statik HLS — hammasi same-origin.
#  Hestia: https://cam.ttysi.uz -> http://172.16.0.23:3000 -> shu server.
# =============================================================================

# HLS keshi: playlist (.m3u8) jonli -> keshlash MUMKIN EMAS; segment (.ts)
# o'zgarmas -> qisqa muddat keshlanadi.
map $uri $hls_cache {
    default   "no-cache";
    ~*\.ts$   "public, max-age=30";
}

server {
    listen 80;
    server_name _;

    # Redirect'lar nisbiy bo'lsin (Location: /status/). Aks holda nginx ichki
    # 80-portga ishora qiladi va tashqi 3000-port yo'qoladi -> sahifa ochilmaydi.
    absolute_redirect off;

    # --- Xavfsizlik ---
    server_tokens off; # nginx versiyasini oshkor qilmaymiz
    client_max_body_size 64k; # API faqat kichik JSON qabul qiladi
    # CSP, nosniff, X-Frame-Options, Referrer/Permissions-Policy, HSTS —
    # admin image build'ida yaratiladi (admin/scripts/security-headers.mjs).
    # Diqqat: nginx'da location ichidagi add_header server darajasidagilarni
    # BEKOR qiladi — o'z add_header'i bor location'larda ham include qiling.
    include /etc/nginx/snippets/security-headers.conf;

    # --- Static admin (Nuxt `npm run generate` -> .output/public) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin sahifalari qidiruvlarda chiqmasin (regex location prefix'dan ustun).
    location ~ ^/(login|admin|add|edit|status|live|users|roles|groups|audit|profile|no-access|nvrs|nvr-cameras|playback|discovery|netconfig|topology) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # stream-auth — faqat MediaMTX ichkaridan (service:4000 ga to'g'ridan)
    # chaqiradi; tashqi dunyoga bu endpoint umuman ko'rinmasin.
    location = /api/stream-auth {
        return 404;
    }
    location = /api/hls-auth {
        return 404;
    }

    # /hls/ ruxsat tekshiruvi (ichki): ochiq kamera — hammaga, yopiq kamera —
    # faqat Bearer token bilan, ruxsati bor xodimga (service/src/routes/hlsAuth.js).
    location = /_hls_auth {
        internal;
        proxy_pass http://service:4000/api/hls-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization  $http_authorization;
    }

    # Qirqilgan yozuvni yuklab olish — katta MP4: nginx diskka buferlamasin,
    # to'g'ridan oqim bilan uzatilsin.
    location ~ ^/api/playback/exports/[^/]+/file$ {
        proxy_pass http://service:4000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Service API -> docker service:4000 (same-origin, CORSsiz) ---
    location /api/ {
        proxy_pass http://service:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Statik HLS (MediaMTX hlsDirectory -> /hls) ---
    # Ochiq kameralar: login/parolsiz, istalgan sayt embed qila oladi (CORS: *).
    # Yopiq kameralar: auth_request — faqat ruxsati bor xodim (Bearer token).
    # URL: https://cam.ttysi.uz/hls/{slug}/index.m3u8
    location /hls/ {
        auth_request /_hls_auth;
        alias /hls/;
        autoindex off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin  *          always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        # .m3u8 -> no-cache, .ts -> qisqa kesh (yuqoridagi map orqali).
        add_header Cache-Control $hls_cache                 always;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        # Tomoshabin yo'q kamera katalogi bo'lmasligi mumkin -> 404 normal holat.
    }

    # --- Yozuvlarni qayta ko'rish (playback) sessiyalari ---
    # URL: /hls-pb/<sessiya-uuid>/index.m3u8. UUID taxmin qilib bo'lmaydi va
    # sessiya heartbeat'siz 60s da o'chadi. CORS YO'Q (faqat shu sayt), keshsiz.
    location /hls-pb/ {
        alias /hls-pb/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
    }
}
