# =============================================================================
#  Gateway nginx (Docker): admin SPA + /api + statik HLS — hammasi same-origin.
#  Hestia: https://cam.ttysi.uz -> http://172.16.0.23:3000 -> shu server.
# =============================================================================

# HLS keshi: playlist (.m3u8) jonli -> keshlash MUMKIN EMAS; segment (.ts)
# o'zgarmas -> qisqa muddat keshlanadi.
map $uri $hls_cache {
    default   "no-cache";
    ~*\.ts$   "public, max-age=30";
}

server {
    listen 80;
    server_name _;

    # Redirect'lar nisbiy bo'lsin (Location: /status/). Aks holda nginx ichki
    # 80-portga ishora qiladi va tashqi 3000-port yo'qoladi -> sahifa ochilmaydi.
    absolute_redirect off;

    # --- Xavfsizlik ---
    server_tokens off; # nginx versiyasini oshkor qilmaymiz
    # Diqqat: nginx'da location ichidagi add_header server darajasidagilarni
    # BEKOR qiladi — o'z add_header'i bor location'larda kerakligini takrorlang.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Static admin (Nuxt `npm run generate` -> .output/public) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin sahifalari qidiruvlarda chiqmasin (regex location prefix'dan ustun).
    location ~ ^/(login|admin|add|edit|status) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }

    # stream-auth — faqat MediaMTX ichkaridan (service:4000 ga to'g'ridan)
    # chaqiradi; tashqi dunyoga bu endpoint umuman ko'rinmasin.
    location = /api/stream-auth {
        return 404;
    }

    # --- Service API -> docker service:4000 (same-origin, CORSsiz) ---
    location /api/ {
        proxy_pass http://service:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Statik HLS (MediaMTX hlsDirectory -> /hls) ---
    # Segment va playlistlar oddiy FAYL sifatida beriladi: session/cookie/auth
    # YO'Q. Shu sabab admin ham, istalgan tashqi sayt ham (CORS: *) embed qila oladi.
    # URL: https://cam.ttysi.uz/hls/{slug}/index.m3u8
    location /hls/ {
        alias /hls/;
        add_header Access-Control-Allow-Origin  *          always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        # .m3u8 -> no-cache, .ts -> qisqa kesh (yuqoridagi map orqali).
        add_header Cache-Control $hls_cache                 always;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        # Tomoshabin yo'q kamera katalogi bo'lmasligi mumkin -> 404 normal holat.
    }
}
