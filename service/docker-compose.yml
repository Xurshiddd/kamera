# Serverda (institut tarmog'idagi kompyuter/server) ishga tushadi.
# MediaMTX va service bir xil hostda turadi.

services:
  mediamtx:
    # -ffmpeg variant: ichida ffmpeg bor (H265 -> H264 transcoding uchun shart)
    image: bluenviron/mediamtx:latest-ffmpeg
    network_mode: host # RTSP/WebRTC uchun shart
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    restart: unless-stopped

  service:
    build: .
    network_mode: host # MediaMTX (127.0.0.1:9997) va auth-callback uchun
    env_file: .env
    volumes:
      - ./data:/app/data # kamera.db shu yerda saqlanadi
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - mediamtx
