# =============================================================================
#  nginx — DOCKER serverining O'ZIDA (172.16.0.21).
#  Bitta origin: static admin + /api + /stream — hammasi shu nginx orqali.
#  Shunda brauzer 172.16.0.21 ga TO'G'RIDAN ulanmaydi (PNA/mixed-content yo'q).
#
#     /            ->  static admin fayllar (Nuxt generate natijasi)
#     /api/...     ->  127.0.0.1:4000  (service)
#     /stream/...  ->  127.0.0.1:8888  (MediaMTX HLS)
#
#  Bu konfig 2 holatda ham ishlaydi (server_name _):
#   - To'g'ridan:  http://172.16.0.21/
#   - Hestia proxy: https://online.ttysi.uz -> http://172.16.0.21
#
#  O'rnatish:
#   sudo mkdir -p /var/www/kamera-admin
#   # admin .output/public mazmunini shu papkaga yuklang (pastga qarang)
#   sudo cp service-server.conf /etc/nginx/sites-available/kamera
#   sudo ln -s /etc/nginx/sites-available/kamera /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    # --- Static admin (Nuxt `npm run generate` -> .output/public) ---
    root /var/www/kamera-admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Service API -> docker :4000 ---
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- HLS oqim -> MediaMTX :8888 (/stream prefiksi olib tashlanadi) ---
    location /stream/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
