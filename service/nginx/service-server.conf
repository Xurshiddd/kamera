# =============================================================================
#  nginx — DOCKER serverining O'ZIDA (172.16.0.21).
#  Hestia nginx'iga TEGILMAYDI. Bu nginx :80 da tinglab, kelgan so'rovni
#  path bo'yicha docker (host-network) portlariga yo'naltiradi:
#
#     http://172.16.0.21/api/...     ->  127.0.0.1:4000   (service)
#     http://172.16.0.21/stream/...  ->  127.0.0.1:8888   (MediaMTX HLS)
#
#  O'rnatish (Linux server):
#     sudo apt install nginx
#     sudo cp service-server.conf /etc/nginx/sites-available/kamera
#     sudo ln -s /etc/nginx/sites-available/kamera /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default   # :80 ni bo'shatish uchun
#     sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    server_name 172.16.0.21;   # yoki _;  (har qanday host)

    # --- Service API -> docker :4000 ---
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- HLS oqim -> MediaMTX :8888 ---
    # Oxiridagi "/" /stream prefiksini olib tashlaydi:
    #   /stream/cam-1/index.m3u8  ->  /cam-1/index.m3u8
    location /stream/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;                                # HLS kechikishini kamaytiradi
        add_header Access-Control-Allow-Origin "*" always;  # boshqa saytga embed uchun
    }

    # (Ixtiyoriy) WebRTC ishlatsangiz — MediaMTX :8889:
    # location /stream-webrtc/ {
    #     proxy_pass http://127.0.0.1:8889/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    # }
}
