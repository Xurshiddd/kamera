# =============================================================================
#  Docker "gateway" nginx — Cloudflare Tunnel orqasida.
#  panel.DOMEN uchun: static admin + /api (same-origin).
#  (HLS oqim alohida subdomenда: stream.DOMEN -> MediaMTX :8888, bu yerда emas.)
#
#  cloudflared public hostname: panel.DOMEN -> http://gateway:80
# =============================================================================

server {
    listen 80;
    server_name _;

    # --- Static admin (Nuxt `npm run generate` -> .output/public) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Service API -> docker service:4000 (same-origin, CORSsiz) ---
    location /api/ {
        proxy_pass http://service:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
