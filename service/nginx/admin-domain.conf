# =============================================================================
#  nginx — HTTPS domen turgan serverda (Hestia yoki o'zingiz boshqaradigan).
#  Vazifasi: brauzer FAQAT HTTPS bilan gaplashadi, LAN'dagi service'ga (HTTP)
#  o'tish server ichida bo'ladi. Shunda mixed-content bloklanmaydi.
#
#  Joylashuv (LAN IP'ni o'zingiznikiga almashtiring):
#    - Admin SPA (static)      ->  public_html/admin/   (Hestia bergan papka)
#    - /api/    -> proxy       ->  http://192.168.1.50:4000   (service)
#    - /stream/ -> proxy       ->  http://192.168.1.50:8888   (MediaMTX HLS)
# =============================================================================

# --- LAN'dagi service serverining IP'si (BIR JOYDA o'zgartiring) ---
# nginx'da o'zgaruvchini http{} blokida e'lon qilib bo'lmaydi, shuning uchun
# quyida to'g'ridan IP yozilgan. Hammasini bir xil qiling.

# ---------------------------------------------------------------------------
#  A) HESTIA ishlatsangiz:
#     Faqat quyidagi 2 ta `location` blokini domeningizning SSL nginx
#     konfigiga qo'shing. Hestia'da buni domen -> "Proxy Template" yoki
#     custom include orqali qilinadi:
#       /home/<user>/conf/web/<domen>/nginx.ssl.conf_*  (yoki .hsts/.custom)
#     /admin/ static'ni Hestia o'zi public_html/admin'dan beradi — tegmang.
# ---------------------------------------------------------------------------

# --- Service API: brauzer https://<domen>/api/... ni chaqiradi ---
location /api/ {
    proxy_pass http://192.168.1.50:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- HLS oqim: https://<domen>/stream/<slug>/index.m3u8?token=... ---
# Oxiridagi "/" /stream prefiksini olib tashlaydi: /stream/cam-1/... -> /cam-1/...
location /stream/ {
    proxy_pass http://192.168.1.50:8888/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;                 # HLS kechikishini kamaytiradi
    add_header Access-Control-Allow-Origin "*" always;  # boshqa saytga embed uchun
}

