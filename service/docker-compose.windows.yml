# Windows / Mac Docker Desktop uchun.
# Asosiy docker-compose.yml `network_mode: host` ishlatadi — bu faqat Linux
# serverda to'g'ri ishlaydi. Windows'da host-tarmoq portlari localhost'ga
# chiqmaydi, shuning uchun bu yerda bridge tarmoq + ochiq portlardan foydalanamiz.
#
# Ishga tushirish:
#   cd service
#   docker compose -f docker-compose.windows.yml up -d --build
#
# To'xtatish:
#   docker compose -f docker-compose.windows.yml down

services:
  mediamtx:
    # NVENC (GPU) transkod uchun maxsus image: mediamtx + NVIDIA ffmpeg.
    build:
      context: .
      dockerfile: mediamtx-nvenc.Dockerfile
    image: kamera-mediamtx-nvenc
    volumes:
      - ./mediamtx.windows.yml:/mediamtx.yml
    ports:
      - "8888:8888" # HLS  -> brauzer shu portdan oqimni oladi
      - "8889:8889" # WebRTC (ixtiyoriy)
      - "8554:8554" # RTSP
    restart: unless-stopped
    # RTX 3070'ni konteynerga beramiz (NVENC/NVDEC/scale_npp uchun).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  service:
    build: .
    env_file: .env.local # LOCAL sozlamalar (prod uchun docker-compose.yml -> .env)
    environment:
      # Bridge tarmoqda MediaMTX'ni konteyner nomi orqali topamiz (.env'dagi
      # 127.0.0.1 qiymatini ustidan yozadi).
      - MEDIAMTX_API=http://mediamtx:9997
    ports:
      - "4000:4000" # admin panel (host'dagi npm run dev) shu portga ulanadi
    volumes:
      - ./data:/app/data # kamera.db shu yerda saqlanadi
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - mediamtx
