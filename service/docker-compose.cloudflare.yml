# =============================================================================
#  Cloudflare Tunnel override — docker-compose.windows.yml USTIGA qo'llanadi.
#  cloudflared Windows'да NATIVE ishlaydi (Docker'да emas), shuning uchun
#  tunnel marshrutlari `localhost:PORT` ga ishora qiladi (docker nomi emas).
#
#  Ishga tushirish:
#    cd service
#    docker compose --env-file .env.cloudflare \
#      -f docker-compose.windows.yml -f docker-compose.cloudflare.yml up -d --build
#
#  .env.cloudflare ichida (maxfiy, git'ga tushmaydi):
#    PANEL_DOMAIN=online.ttysi.uz
#    STREAM_DOMAIN=stream.ttysi.uz
#
#  Cloudflare tunnel'да Public Hostname (Routes -> Add route):
#    online.ttysi.uz   -> HTTP -> localhost:8080   (gateway: admin + /api)
#    stream.ttysi.uz   -> HTTP -> localhost:8888   (MediaMTX HLS)
# =============================================================================

services:
  # Service'ga public manzillar: HLS URL'lari stream.DOMEN, CORS origini panel.
  service:
    environment:
      - MEDIAMTX_API=http://mediamtx:9997
      - STREAM_BASE=https://${STREAM_DOMAIN}
      - ADMIN_ORIGIN=https://${PANEL_DOMAIN}

  # Static admin (Nuxt generate) + /api same-origin proxy.
  # 8080 portда host'ga ochiladi -> native cloudflared localhost:8080 orqali topadi.
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ../admin/.output/public:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - service
